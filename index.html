<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>ナイト・ラッシュ！〜ふういんされた もじを とりもどせ〜</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1330;font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;color:#fff;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;touch-action:none;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:0}
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
/* HUD */
#hud{position:fixed;top:calc(var(--st) + 8px);left:10px;right:10px;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:5}
.hstage{font-weight:900;font-size:13px;background:rgba(10,20,60,.7);padding:5px 10px;border-radius:12px;white-space:nowrap}
.hprog{flex:1;height:10px;background:rgba(0,0,0,.35);border-radius:6px;overflow:hidden;border:2px solid rgba(255,255,255,.6)}
#hProg{height:100%;width:0;background:linear-gradient(90deg,#5ad1ff,#ffd34d);transition:width .1s}
.hvote{font-weight:900;font-size:14px;background:rgba(10,20,60,.7);padding:5px 9px;border-radius:12px}
#btnPause{pointer-events:auto;width:38px;height:34px;border-radius:12px;background:rgba(10,20,60,.75);color:#fff;font-weight:900;font-size:14px;border:2px solid rgba(255,255,255,.5)}
#hudSide{position:fixed;top:calc(var(--st) + 50px);right:10px;text-align:right;font-weight:900;z-index:4;pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#hCombo{font-size:18px;color:#ffd34d}#hShield{font-size:16px}
#feverTag{position:fixed;top:calc(var(--st) + 48px);left:12px;font-weight:900;font-size:22px;color:#ffd34d;text-shadow:0 0 12px #ff9f1c,0 2px 0 #7a4a00;animation:pul .4s infinite alternate;z-index:4;pointer-events:none}
@keyframes pul{to{transform:scale(1.12)}}
/* 問題バナー */
#qb{position:fixed;top:calc(var(--st) + 84px);left:50%;transform:translateX(-50%);width:min(94vw,620px);background:rgba(10,22,70,.82);border:2px solid #7cf;border-radius:14px;padding:6px 10px 8px;z-index:6;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:qin .25s ease-out}
#qb.rev{border-color:#ff9f1c;background:rgba(70,30,5,.9)}
@keyframes qin{from{transform:translateX(-50%) scale(.85);opacity:0}}
.qtop{display:flex;gap:6px;align-items:center;margin-bottom:2px}
.qno{font-size:11px;font-weight:900;background:#1e5fd6;padding:2px 8px;border-radius:8px}
.qrev{font-size:12px;font-weight:900;background:#ff6a00;padding:2px 8px;border-radius:8px;animation:pul .35s infinite alternate}
.qtext{font-size:clamp(14px,3.8vw,19px);font-weight:800;line-height:1.35}
.qch{display:flex;gap:8px;margin-top:8px}
.ch{flex:1;text-align:center;font-weight:900;font-size:clamp(14px,4vw,20px);padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);transition:all .12s;line-height:1.25}
.ch.on{background:#ffd34d;color:#3a2600;border-color:#fff;transform:scale(1.04)}
.qbar{height:5px;background:rgba(255,255,255,.18);border-radius:4px;margin-top:5px;overflow:hidden}
#qBar{height:100%;background:linear-gradient(90deg,#ff5a5a,#ffd34d,#7dff8a);width:100%}
#toast{position:fixed;top:calc(var(--st) + 52px);left:50%;transform:translateX(-50%);width:min(92vw,600px);padding:12px 14px;border-radius:16px;z-index:7;font-size:15px;line-height:1.5;font-weight:800;pointer-events:none;animation:qin .2s}
#toast.bad{background:rgba(120,10,20,.92);border:3px solid #ff8a8a}
#toast b{font-size:17px;color:#ffe066}
#hint{position:fixed;left:50%;bottom:calc(var(--sb) + 6%);transform:translateX(-50%);z-index:5;pointer-events:none;font-weight:900;font-size:18px;text-align:center;text-shadow:0 2px 4px #000}
#hint .hand{font-size:44px;animation:swipe 1.2s ease-in-out infinite}
@keyframes swipe{0%,100%{transform:translateX(-50px)}50%{transform:translateX(50px)}}
/* ボス */
#bossUI{position:fixed;top:calc(var(--st) + 48px);left:50%;transform:translateX(-50%);width:min(90vw,560px);z-index:5;pointer-events:none;text-align:center}
#bName{font-weight:900;font-size:16px;text-shadow:0 2px 0 #000;margin-bottom:3px}
.hp{height:16px;background:rgba(0,0,0,.5);border:2px solid #fff;border-radius:9px;overflow:hidden;position:relative}
#bHP{height:100%;background:linear-gradient(90deg,#ff2a5a,#ff9f1c);transition:width .4s ease-out;width:100%}
#bHPn{position:absolute;inset:0;font-size:11px;font-weight:900;line-height:12px}
#bq{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 12px calc(var(--sb) + 12px);background:linear-gradient(180deg,rgba(10,15,45,.88),rgba(10,15,45,.98));border-top:3px solid #ffd34d;border-radius:22px 22px 0 0;animation:bqin .3s ease-out;max-height:46vh;overflow:auto}
@keyframes bqin{from{transform:translateY(100%)}}
.bqw{max-width:680px;margin:0 auto}
#bqNo{font-size:12px;font-weight:900;color:#ffd34d}
#bqText{font-size:clamp(15px,4.2vw,21px);font-weight:800;line-height:1.4;margin:3px 0 7px}
#bqCrit{height:6px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-bottom:8px;position:relative}
#bqCritBar{height:100%;background:linear-gradient(90deg,#ff9f1c,#ffe066);width:100%}
#bqCrit.off{opacity:.3}
#bqGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bqb{background:#fff;color:#1a2550;font-weight:800;font-size:clamp(13px,3.6vw,17px);padding:10px 8px;border-radius:14px;text-align:left;line-height:1.35;box-shadow:0 4px 0 #8a9bd0;display:flex;gap:6px;align-items:flex-start;min-height:52px}
.bqb:active{transform:translateY(3px);box-shadow:none}
.bqk{background:#1e5fd6;color:#fff;border-radius:7px;padding:0 6px;font-size:12px;flex:none;margin-top:2px}
.bqb.ok{background:#3ce66e;color:#053a12;box-shadow:0 4px 0 #1a8a3a;animation:pul .3s 3 alternate}
.bqb.ng{background:#ff5a5a;color:#fff;box-shadow:0 4px 0 #a01818}
.bqb:disabled{opacity:1}
#bqExp{margin-top:9px;font-size:14px;line-height:1.5;font-weight:700;padding:8px 10px;border-radius:12px}
#bqExp.okx{background:rgba(60,230,110,.18);border:2px solid #3ce66e}
#bqExp.ngx{background:rgba(255,60,60,.18);border:2px solid #ff6a6a}
#bqExp b{color:#ffe066}
#bqNext{display:block;margin:10px auto 0;padding:10px 30px;border-radius:22px;background:#ffd34d;color:#3a2600;font-weight:900;font-size:16px;box-shadow:0 4px 0 #b8860b}
/* オーバーレイ */
#scr{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:calc(var(--st) + 14px) 14px calc(var(--sb) + 14px);overflow:auto}
#scr.show{display:flex}
#scr.map,#scr.result,#scr.review,#scr.intro,#scr.over,#scr.settings,#scr.pause{background:rgba(8,12,35,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#scr.map,#scr.review,#scr.settings,#scr.intro,#scr.result{align-items:flex-start}
.ttl{text-align:center;margin-top:-6vh}
.logo{display:flex;flex-direction:column;align-items:center;transform:rotate(-4deg);animation:float 2.4s ease-in-out infinite}
@keyframes float{50%{transform:rotate(-4deg) translateY(-8px)}}
.l1,.l2{font-weight:900;line-height:1;-webkit-text-stroke:0;text-shadow:0 5px 0 #0b2a7a,0 0 0 #000,4px 4px 0 #0b2a7a,-3px -3px 0 #fff}
.l1{font-size:clamp(46px,14vw,92px);color:#ffd34d}
.l2{font-size:clamp(52px,16vw,104px);color:#fff;text-shadow:0 6px 0 #c62828,4px 4px 0 #c62828}
.lsub{margin:14px 0 26px;font-weight:900;font-size:clamp(15px,4.4vw,22px);background:rgba(10,20,60,.75);display:inline-block;padding:6px 16px;border-radius:16px}
.tnote{margin-top:16px;font-size:14px;font-weight:800;text-shadow:0 2px 3px #000}
.big{display:block;margin:10px auto 0;padding:14px 34px;border-radius:30px;background:linear-gradient(180deg,#ffe066,#ffb300);color:#4a2c00;font-weight:900;font-size:20px;box-shadow:0 5px 0 #a66a00,0 8px 18px rgba(0,0,0,.35);min-width:220px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #a66a00}
.big.warn{background:linear-gradient(180deg,#ff8a5a,#ff5a3c);color:#fff;box-shadow:0 5px 0 #a02a10}
.pulse{animation:bp 1s ease-in-out infinite}
@keyframes bp{50%{transform:scale(1.06)}}
.sm{width:42px;height:38px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;font-size:18px;font-weight:900}
.sm2{display:block;margin:10px auto 0;padding:10px 22px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff;font-weight:900;font-size:15px;border:2px solid rgba(255,255,255,.35);min-width:200px}
.sm2.danger{border-color:#ff6a6a;color:#ffb0b0}
.map{width:min(100%,560px);margin:0 auto}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mt{text-align:center;font-weight:900;font-size:24px;line-height:1.1}.mt small{display:block;font-size:12px;color:#ffd34d}
.wbadge{background:rgba(255,106,0,.25);border:2px solid #ff9f1c;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:800;margin-bottom:8px}
.path{position:relative;padding:6px 0}
.node{display:flex;align-items:center;gap:10px;width:78%;margin:8px 0;padding:8px 12px 8px 8px;border-radius:20px;background:linear-gradient(180deg,#2f6bff,#1e48c0);color:#fff;text-align:left;box-shadow:0 5px 0 #0f2a7a;position:relative}
.node.r{margin-left:22%}.node.l{margin-left:0}
.node.wb{background:linear-gradient(180deg,#ff3a6a,#a0103a);box-shadow:0 5px 0 #5a0820}
.node.lock{filter:grayscale(1) brightness(.6)}
.node:active{transform:translateY(3px);box-shadow:0 2px 0 #0f2a7a}
.nb{width:64px;height:64px;background:rgba(255,255,255,.15);border-radius:14px;flex:none}
.nn{font-size:11px;font-weight:900;color:#ffd34d}.nm{font-size:19px;font-weight:900}.ns{font-size:16px;color:#ffd34d;letter-spacing:2px}
.others{margin-top:14px;background:rgba(0,0,0,.25);border-radius:16px;padding:10px}
.oh{font-weight:900;font-size:13px;color:#aab;margin-bottom:4px}
.ow{font-size:14px;font-weight:800;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;gap:6px;color:#bbc}.ow span{font-size:11px;color:#889;white-space:nowrap}
.ow.exam{color:#ffd34d}
.card{width:min(100%,520px);margin:0 auto;background:linear-gradient(180deg,#1d2a6a,#121a48);border:3px solid rgba(255,255,255,.25);border-radius:26px;padding:18px 16px 20px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:cin .3s ease-out}
@keyframes cin{from{transform:scale(.85);opacity:0}}
.in{font-weight:900;color:#ffd34d;font-size:14px;letter-spacing:2px}
.it{font-weight:900;font-size:28px;line-height:1.2}.it small{display:block;font-size:14px;color:#aac}
#introBoss{width:220px;height:178px;display:block;margin:4px auto 0}
.ib{font-weight:800;font-size:16px}
.ibub{background:#fff;color:#222;border-radius:14px;padding:9px 12px;margin:8px auto;font-weight:800;font-size:14px;line-height:1.5;position:relative;max-width:420px}
.ibub:before{content:'';position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:#fff}
.ik{font-size:13px;line-height:1.6;background:rgba(255,255,255,.08);border-radius:12px;padding:8px;margin:8px 0;font-weight:700}.ik b{color:#7cf}
.how{font-size:13px;line-height:1.8;text-align:left;background:rgba(255,211,77,.12);border:2px dashed #ffd34d;border-radius:12px;padding:8px 10px;font-weight:800}
.res .rt,.over .rt{font-weight:900;font-size:34px;color:#ffd34d;text-shadow:0 4px 0 #a66a00}
.over .rt.red{color:#ff6a6a;text-shadow:0 4px 0 #7a0a0a}
.stars{font-size:54px;letter-spacing:6px;margin:4px 0}
.st{color:#3a4170;display:inline-block}.st.on{color:#ffd34d;animation:spop .5s cubic-bezier(.3,1.8,.5,1) both;text-shadow:0 0 16px #ffb300}
@keyframes spop{from{transform:scale(0) rotate(-90deg)}}
.wc{font-weight:900;color:#ffd34d;margin:4px 0 8px}
.rows{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 12px;margin:8px 0}
.rows div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800}
.rows div:last-child{border:0}.rows b{font-size:18px}.rows em{color:#ff6a9a;font-style:normal;font-size:12px}
.tip{font-size:13px;color:#ccd;font-weight:700;margin-top:6px}
.orz{font-weight:800;font-size:16px;margin:8px 0;line-height:1.5}
.rvsub{font-size:13px;color:#ffd34d;font-weight:800;margin-bottom:8px}
.rvl{text-align:left}
.rvi{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;margin-bottom:8px;border-left:5px solid #ff9f1c}
.rq{font-weight:800;font-size:15px;line-height:1.45}
.ra{color:#7dff8a;font-weight:900;font-size:17px;margin-top:4px}
.rb{color:#ff8a8a;font-weight:800;font-size:13px;text-decoration:line-through}
.re{font-size:13px;color:#dde;margin-top:4px;line-height:1.5;font-weight:700}
.set textarea{width:100%;height:64px;border-radius:10px;border:0;padding:8px;font-size:11px;margin-top:4px;font-family:monospace;-webkit-user-select:text;user-select:text}
.sh{font-weight:900;margin-top:14px;text-align:left}.ss{font-size:12px;color:#ccd;text-align:left;font-weight:700}
#vsel{width:100%;font-size:15px;padding:8px;border-radius:10px;margin-top:4px;font-family:inherit}
.rates{display:flex;gap:6px;margin-top:4px}.rt2{flex:1;padding:8px;border-radius:12px;background:#fff0f5;color:#ff5a7a;font-weight:900;font-family:inherit;border:2px solid #ffb3c6}.rt2.on{background:#ff5a7a;color:#fff}
#setMsg{color:#7dff8a;margin-top:6px;text-align:center}

    scr.innerHTML = `<div class="ttl"><div class="logo"><span class="l1">ナイト</span><span class="l2">ラッシュ！</span></div>
      <button class="big pulse" data-act="toMap" style="margin-top:34px">▶ スタート</button></div>`;
  } else if (name === 'map') {
    const cards = WORLD_ORDER.map(wk => {
      const Wd = WORLDS[wk], open = worldOpen(wk);
      const nodes = Wd.stages.map((st, si) => { const ok = stageOpen(wk, si), s = save.stars[stageKey(wk, si)] || 0; return `<button class="sn ${ok ? '' : 'lock'} ${si === Wd.stages.length - 1 && st.mode === 'word' ? 'ana' : ''}" data-act="${ok ? 'intro' : 'nop'}" data-arg="${wk}:${si}"><b>${ok ? si + 1 : '🔒'}</b><small>${ok ? starStr(s) : ''}</small></button>`; }).join('');
      return `<div class="wc ${open ? '' : 'lock'}" style="--wc:${Wd.color}"><div class="wch"><span class="wci">${Wd.icon}</span><span class="wcn">${Wd.name}</span></div>
        ${open ? `<div class="sns">${nodes}</div>` : `<div class="wlock">🔒 ${WORLDS[Wd.unlock].name}を ぜんぶ クリアすると ひらくよ</div>`}</div>`;
    }).join('');
    const nW = Object.keys(save.wrong).length;
    scr.innerHTML = `<div class="map"><div class="mh"><button class="sm" data-act="toTitle">◀</button><div class="mt">どこへ いく？</div><button class="sm" data-act="settings">⚙</button></div>
      ${nW ? `<div class="wbadge">まちがえた もんだい ${nW}こ → つぎの ステージで また でるよ！</div>` : ''}
      ${cards}</div>`;
  } else if (name === 'intro') {
    const [wk, si] = G.intro, Wd = WORLDS[wk], st = Wd.stages[si];
    scr.innerHTML = `<div class="card intro" style="--wc:${Wd.color}"><div class="in">${Wd.name} ステージ ${si + 1}</div><div class="it">${st.sub}</div>
      <canvas id="introBoss" width="320" height="260"></canvas><div class="ib">ボス：<b style="color:${st.boss.c1}">${st.boss.name}</b></div>
      <div class="ibub">${({ kazu: 'かず', toke: 'とけい', iro: 'いろと かたち' })[wk] || 'もじ'}は ぜんぶ ふういん してやる！</div>
      <button class="big pulse" data-act="go">しゅっぱつ！</button><button class="sm2" data-act="toMap">もどる</button></div>`;
    const c = $('#introBoss').getContext('2d'); let tt = 0;
    const anim = () => { if (scr.className.indexOf('intro') < 0 || !$('#introBoss')) return; tt += 1 / 60; c.clearRect(0, 0, 320, 260); drawBossAt(c, st.boss, 160, 246, 19, tt, false, wk); requestAnimationFrame(anim); }; anim();
    speak(`${Wd.name}。 ステージ ${si + 1}。 ${st.sub}`);
  } else if (name === 'pause') {
    scr.innerHTML = `<div class="card"><div class="it">ちょっと きゅうけい</div><button class="big" data-act="resume">つづける</button><button class="sm2" data-act="retry">さいしょから</button><button class="sm2" data-act="quit">もどる</button></div>`;
  } else if (name === 'result') {
    const R = G.lastResult, r = R.r, nextOk = r.si < r.W.stages.length - 1;
    scr.innerHTML = `<div class="card res"><div class="rt">クリア！</div>
      <div class="stars">${[0, 1, 2].map(i => `<span class="st ${i < R.stars ? 'on' : ''}" style="animation-delay:${.2 + i * .25}s">★</span>`).join('')}</div>
      <div class="rows"><div><span>せいかい</span><b>${r.stats.correct} / ${r.stats.total}</b></div><div><span>きしだん</span><b>${r.n}にん</b></div><div><span>きんか</span><b>🪙${r.stars}</b></div></div>
      ${r.learned.length ? `<div class="lh">とりもどした ${({ kazu: 'かず', toke: 'とけい', iro: 'いろ・かたち' })[r.wk] || 'もじ'}</div><div class="chips">${r.learned.map(c => `<span>${c}</span>`).join('')}</div>` : ''}
      ${!R.reviewed ? `<button class="big pulse warn" data-act="review">まちがえた もんだいを みる</button>` :
        `${nextOk ? '<button class="big pulse" data-act="next">つぎの ステージへ ▶</button>' : '<div class="wc2">🏆 このワールドは ぜんぶ クリア！</div>'}<button class="sm2" data-act="retry">もういちど</button><button class="sm2" data-act="toMap">もどる</button>`}</div>`;
    speak(R.stars === 3 ? 'すごい！ ぜんぶ せいかい！' : 'クリア！ よく がんばったね！');
  } else if (name === 'review') {
    const list = G.lastResult.r.wrongs;
    scr.innerHTML = `<div class="card rev"><div class="it">おぼえよう！</div><div class="rvsub">タッチすると こえが でるよ</div>
      <div class="rvl">${list.map((q, i) => `<button class="rvi" data-act="say" data-arg="${i}"><div class="rvb">${q.type === 'word' ? q.big.replace('◯', `<u>${q.ans}</u>`) : q.type === 'letter' ? q.ans : (q.type === 'clock' || q.type === 'iro') ? (q.chip || '') : q.big.replace(/\n/g, '')}</div><div class="rvt">${q.teach}</div></button>`).join('')}</div>
      <button class="big" data-act="reviewDone">おぼえた！</button></div>`;
  } else if (name === 'settings') {
    const data = btoa(unescape(encodeURIComponent(JSON.stringify(save))));
    scr.innerHTML = `<div class="card set"><div class="it">せってい</div>
      <button class="sm2" data-act="voice">${save.voice ? '🗣 よみあげ：オン' : '🤐 よみあげ：オフ'}</button>
      <button class="sm2" data-act="snd">${save.sound ? '🔊 おと：オン' : '🔇 おと：オフ'}</button>
      <div class="sh">こえ</div><div class="rates"><button class="rt2 ${save.vmode !== 'device' ? 'on' : ''}" data-act="vmode" data-arg="game">ゲームの こえ</button><button class="rt2 ${save.vmode === 'device' ? 'on' : ''}" data-act="vmode" data-arg="device">たんまつの こえ</button></div>
      ${save.vmode === 'device' ? `      <div class="sh">こえの しゅるい</div><select id="vsel">${jaVoices.length ? jaVoices.map(v => `<option value="${vid(v)}" ${jaVoice && vid(v) === vid(jaVoice) ? 'selected' : ''}>${vlabel(v)}</option>`).join('') : '<option>（えらべる こえが ありません）</option>'}</select>
      <button class="sm2" data-act="vreload">🔄 こえを さがしなおす</button>
` : ''}
      <div class="sh">はやさ</div><div class="rates">${[[.85, 'ゆっくり'], [1, 'ふつう'], [1.1, 'はやい']].map(([v, l]) => `<button class="rt2 ${(save.rate || 1) === v ? 'on' : ''}" data-act="rate" data-arg="${v}">${l}</button>`).join('')}</div>
      <button class="sm2" data-act="vtest">🗣 ためしに きく</button>
      <div class="ss">こえが カタコトのときは（おうちのひと むけ）：iPhone・iPadの「せってい」→「アクセシビリティ」→「よみあげコンテンツ」→「こえ」→「日本語」で、「拡張」や「プレミアム」と書いてある声をダウンロードすると、なめらかになります。ダウンロードしたら、ここで「（かくちょう）」や「（プレミアム）」が付いた声を えらんでください。リストに出てこないときは、iPhoneを再起動するか、このページを Safari で開いてください（アプリの中のブラウザでは、ダウンロードした声が使えないことがあります）。</div>
      <div class="sh">きろくの かきだし（おうちのひと むけ）</div><textarea id="exp" readonly>${data}</textarea><button class="sm2" data-act="copy">コピー</button>
      <div class="sh">きろくの よみこみ</div><textarea id="imp" placeholder="ここに はりつけ"></textarea><button class="sm2" data-act="import">よみこむ</button>
      <div id="setMsg" class="ss"></div>${save.lastCrash ? `<div class="sh">まえに おちたときの きろく（おうちのひと むけ）</div><div class="ss">${save.lastCrash.when}／${save.lastCrash.w} ${save.lastCrash.s}-${save.lastCrash.q}もんめ／${save.lastCrash.phase === 'boss' ? 'ボスせん' : 'みちのり'}／なかま ${save.lastCrash.n}にん／ぶき Lv${save.lastCrash.wl}${save.lastCrash.fever ? '／FEVER' : ''}／こうか ${save.lastCrash.parts}・たま ${save.lastCrash.bullets}</div>` : ''}<button class="sm2 danger" data-act="reset">きろくを ぜんぶ けす</button><button class="big" data-act="toMap">もどる</button></div>`;
  }
}
function hideScreen() { scr.className = ''; scr.innerHTML = ''; }
let resetArm = false;
const ACT = {
  nop() { SFX.boo(); },
  toTitle() { G.run = makeDemo(); showScreen('title'); },
  toMap() { audioInit(); speechUnlock(); loadPack('common'); setTimeout(() => { makeBGM('run'); setTimeout(() => makeBGM('boss'), 400); }, 300); bgmMode('calm'); G.paused = false; G.timers = []; G.run = makeDemo(); view.thz = .28; view.tgr = .82; hideUI(); showScreen('map'); },
  intro(arg) { audioInit(); speechUnlock(); const [wk, si] = arg.split(':'); loadPack('common'); loadPack(wk); G.intro = [wk, +si]; showScreen('intro'); },
  go() { startStage(G.intro[0], G.intro[1]); },
  resume() { G.paused = false; try { AU.ctx && AU.ctx.resume(); } catch (e) { } hideScreen(); },
  retry() { G.paused = false; const r = G.run; startStage(r && !r.demo ? r.wk : G.intro[0], r && !r.demo ? r.si : G.intro[1]); },
  quit() { ACT.toMap(); },
  next() { const r = G.lastResult.r; G.intro = [r.wk, r.si + 1]; showScreen('intro'); },
  review() { showScreen('review'); const q = G.lastResult.r.wrongs[0]; if (q) speak(q.teachSay); },
  say(i) { const q = G.lastResult.r.wrongs[+i]; if (q) speak(q.teachSay, true); },
  reviewDone() { G.lastResult.reviewed = true; showScreen('result'); },
  snd(_, b) { save.sound = !save.sound; persist(); if (AU.master) AU.master.gain.value = save.sound ? .55 : 0; playBGM(); b.textContent = save.sound ? '🔊 おと：オン' : '🔇 おと：オフ'; },
  voice(_, b) { save.voice = !save.voice; persist(); b.textContent = save.voice ? '🗣 よみあげ：オン' : '🤐 よみあげ：オフ'; if (save.voice) speak('よみあげ、 オン'); else try { speechSynthesis.cancel(); } catch (e) { } },
  settings() { pickVoice(); showScreen('settings'); const s = $('#vsel'); if (s) s.onchange = () => { save.voiceName = s.value; persist(); pickVoice(); speak('この こえで よむよ', true); }; },
  rate(v) { save.rate = +v; persist(); ACT.settings(); speak('この はやさで よむよ', true); },
  vreload() { pickVoice(); ACT.settings(); $('#setMsg').textContent = `みつかった こえ：${jaVoices.length}こ（かくちょう・プレミアム ${jaVoices.filter(v => vq(v) > 0).length}こ）`; },
  vmode(m) { save.vmode = m; persist(); ACT.settings(); speak('この こえで よむよ', true); },
  vtest() { speak('とらの、 はじめの もじは どっち？', true); },
  copy() { const t = $('#exp'); t.select(); const done = () => $('#setMsg').textContent = 'コピーしました'; try { navigator.clipboard.writeText(t.value).then(done, () => { document.execCommand('copy'); done(); }); } catch (e) { document.execCommand('copy'); done(); } },
  import() { try { const s = JSON.parse(decodeURIComponent(escape(atob($('#imp').value.trim())))); if (!s || s.v !== 1) throw 0; save = Object.assign(defSave(), s); persist(); $('#setMsg').textContent = 'よみこみました'; } catch (e) { $('#setMsg').textContent = 'よみこめませんでした'; } },
  reset(_, b) { if (!resetArm) { resetArm = true; b.textContent = 'もういちど おすと きえます'; return; } resetArm = false; save = defSave(); persist(); showScreen('settings'); $('#setMsg').textContent = 'けしました'; }
};
scr.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; if (b.dataset.act !== 'nop') SFX.click(); ACT[b.dataset.act](b.dataset.arg, b); });
function hideUI() { $('#wchip').classList.remove('boss'); $('#teach').classList.remove('top'); ['#hud', '#qb', '#bossUI', '#feverTag', '#hint', '#wchip', '#teach'].forEach(s => $(s).classList.add('hidden')); }
function startStage(wk, si) {
  audioInit(); speechUnlock(); hideScreen(); hideUI(); G.paused = false; G.timers = []; G.parts = []; G.floats = [];
  G.run = buildRun(wk, si); view.thz = .28; view.tgr = .82; view.hz = .28; view.gr = .82;
  updHud(G.run); $('#hud').classList.remove('hidden'); bgmMode('run');
  bigText(`ステージ ${si + 1}`, '#fff', G.run.st.sub);
}
setInterval(() => { const r = G.run; if (r && !r.demo) $('#hProg').style.width = clamp(r.playerZ / (r.bossZ - 4) * 100, 0, 100) + '%'; }, 100);

// 落ちたときの記録（2秒ごとに保存。ふつうに終わったら消す）
const HBK = 'knightRush_hb';
try { const prev = JSON.parse(localStorage.getItem(HBK) || 'null'); if (prev && prev.live) { save.lastCrash = prev; persist(); } localStorage.removeItem(HBK); } catch (e) { }
setInterval(() => { try { const r = G.run; if (!r || r.demo || r.over) { localStorage.removeItem(HBK); return; } localStorage.setItem(HBK, JSON.stringify({ live: 1, when: new Date().toLocaleString('ja-JP'), w: r.W.name, s: r.si + 1, q: r.gi + 1, phase: r.phase, n: r.n, wl: weaponLv(r), fever: r.fever > 0 ? 1 : 0, parts: G.parts.length, bullets: r.bullets.length, atlas: Object.keys(ATLAS).length, glow: GLOW.size })); } catch (e) { } }, 2000);
addEventListener('pagehide', () => { try { localStorage.removeItem(HBK); } catch (e) { } });
G.run = makeDemo(); showScreen('title'); requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden && G.run && !G.run.demo && !G.run.over && !G.paused) { G.paused = true; showScreen('pause'); } });

</script>
</body>
